[package]
name = "opaque"
version = "0.8.0"
authors = [
  "Stefan Oestreicher <oestef@gmail.com>",
  "Nik Graf <nik@nikgraf.com>",
]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
p256 = ["dep:p256"]

[dependencies]
opaque-ke = { version = "4.0.1" }
# Enables rand's OS entropy (OsRng) used via opaque_ke::rand; no direct API use.
rand = { version = "0.8.5", default-features = false, features = ["std", "getrandom"] }
argon2 = { version = "0.6", features = ["zeroize"] }
p256 = { version = "0.13", default-features = false, features = [
  "hash2curve",
  "voprf",
], optional = true }
base64 = "0.23.1"
libc = "0.2"
generic-array = "0.14"
zeroize = "1.8"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc"] }
hkdf = "0.13"
sha2 = "0.11"

[profile.release]
# Speed over size: the Argon2id key stretching dominates login latency on the client, and opt-level 2
# runs it about 27% faster than "s" (213 ms vs 292 ms per MemoryConstrained hash, measured) for a
# 1.7% larger library. Level 3 gains nothing more.
opt-level = 2
# Do not set `panic = "abort"`: the FFI entry points rely on catch_unwind to keep a panic from
# terminating the host process (see csharp::ffi_boundary).
