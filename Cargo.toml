[package]
name = "opaque"
version = "0.8.0"
authors = [
  "Stefan Oestreicher <oestef@gmail.com>",
  "Nik Graf <nik@nikgraf.com>",
]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
p256 = ["dep:p256"]

[dependencies]
opaque-ke = { version = "3.0.0-pre.4", features = ["argon2"] }
# Enables rand's OS entropy (OsRng) used via opaque_ke::rand; no direct API use.
rand = { version = "0.8.5", default-features = false, features = ["std", "getrandom"] }
argon2 = "0.5"
p256 = { version = "0.13", default-features = false, features = [
  "hash2curve",
  "voprf",
], optional = true }
base64 = "0.21.7"
libc = "0.2"
generic-array = "0.14"
zeroize = "1.8"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = "0.10"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
# Do not set `panic = "abort"`: the FFI entry points rely on catch_unwind to keep a panic from
# terminating the host process (see csharp::ffi_boundary).
