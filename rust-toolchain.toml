# Pinned deliberately rather than tracking "stable".
#
# CI builds the native libraries that ship in the package (they are not committed). An unpinned
# toolchain would silently change the compiler out from under the release. With this pin plus
# `cargo build --locked`, the binaries only change when src/, Cargo.lock, or this file is changed
# on purpose.
#
# Bumping: change the channel and let CI rebuild and test.
[toolchain]
channel = "1.97.1"
profile = "minimal"
