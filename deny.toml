# Local supply-chain policy for `cargo deny check` (not run in CI: `cargo audit` is the CI gate).
# Mirrors .cargo/audit.toml; keep the two ignores in sync.

[advisories]
ignore = [
  # crypto-bigint 0.5.5 timing variability, only via elliptic-curve 0.13 pinned by opaque-ke 3.x
  # (affects only the optional `p256` feature). Remove once opaque-ke moves to elliptic-curve 0.14.
  # See docs/security.md.
  "RUSTSEC-2026-0387",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "Unicode-3.0",
]

[bans]
# Duplicates exist while opaque-ke 3.0 pins the older RustCrypto generation (digest 0.10); they
# go away when it moves. Warn so new ones are noticed, without failing.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
