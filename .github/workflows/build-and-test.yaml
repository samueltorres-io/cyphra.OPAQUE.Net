# Builds the Rust native library for every supported runtime identifier and runs the .NET test
# suite against each one on a runner of that exact architecture.
#
# This is the gate for pull requests into main. It is also exposed via workflow_call so that
# publish.yaml can reuse the matrix rather than duplicate it — jobs from a called workflow
# run inside the same workflow run, so the artifacts uploaded here are downloadable by the caller.
#
# Deliberately uses only first-party actions/* (pinned by commit SHA) plus rustup, preinstalled on GitHub runners.
# Release builds (called from publish.yaml) restore no cache, so nothing cached can end up in the package.

name: Build and test

on:
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

# Literal prefix rather than ${{ github.workflow }}: inside a called workflow that expression
# resolves to the *caller's* name, which would let the two entry points share a group and cancel
# each other.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Separate job on purpose: `cargo install` cannot be checksum-pinned and runs build scripts, so it
  # must not share a runner with the jobs whose output is packed. Still gates releases, because
  # publish.yaml needs this whole workflow to pass. Fails on known-vulnerable dependencies; warnings
  # such as unsound/unmaintained advisories do not fail it. Ignores live in .cargo/audit.toml.
  audit:
    name: Audit dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Cargo.lock
        run: |
          cargo +stable install --locked cargo-audit --version 0.22.2
          cargo audit

  build_and_test:
    name: Build and test (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The two Linux targets are built through cargo-zigbuild against an explicit glibc
          # floor rather than natively. A native build would link against the runner image's own
          # glibc (2.39 on Ubuntu 24.04) and the published package would then refuse to load on
          # Debian 11/12, RHEL 8/9, Amazon Linux 2 and older Ubuntu LTS releases. They are still
          # *tested* natively, on a runner of their own architecture, further down.
          - rid: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            zig_target: x86_64-unknown-linux-gnu.2.17
            cargo_out: libopaque.so
            staged: libopaque.so
            expect_arch: x86-64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            zig_target: aarch64-unknown-linux-gnu.2.17
            cargo_out: libopaque.so
            staged: libopaque-linux-arm64.so
            expect_arch: aarch64
          - rid: win-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            zig_target: ''
            cargo_out: opaque.dll
            staged: opaque.dll
            expect_arch: x86-64
          - rid: win-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            zig_target: ''
            cargo_out: opaque.dll
            staged: opaque-arm64.dll
            # file(1) builds disagree on how they spell PE ARM64.
            expect_arch: aarch64|arm64
          - rid: osx-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            zig_target: ''
            cargo_out: libopaque.dylib
            staged: libopaque-x64.dylib
            expect_arch: x86_64
          - rid: osx-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            zig_target: ''
            cargo_out: libopaque.dylib
            staged: libopaque.dylib
            expect_arch: arm64

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rustup ships in every GitHub-hosted image used here (including windows-11-arm). Fail loudly
      # instead of fetching and executing an installer from the network.
      - name: Require rustup
        run: command -v rustup || { echo "::error::rustup is not installed on this runner"; exit 1; }

      # rust-toolchain.toml pins the version; `rustup show` installs it if it is not present.
      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy
          rustup target add "${{ matrix.target }}"
          rustc --version --verbose
          cargo --version

      - name: Lint and test Rust crate
        run: |
          cargo fmt --check
          cargo clippy --all-targets --all-features --locked -- -D warnings
          cargo test --all-features --locked

      - name: Cache cargo registry and build directory
        if: github.event_name != 'release'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/${{ matrix.target }}
          key: cargo-${{ matrix.rid }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ matrix.rid }}-

      # Zig acts as the cross-linker and carries its own glibc stubs, which is what makes an
      # explicit glibc floor possible. Both zig and cargo-zigbuild come from hash-pinned PyPI
      # wheels (no `cargo install`, which cannot be checksum-pinned and runs build scripts).
      - name: Install cargo-zigbuild
        if: matrix.zig_target != ''
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --user --require-hashes -r .github/requirements-zig.txt
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          # Not `cargo zigbuild --version`: that routes --version into the zigbuild subcommand,
          # which rejects it. Check the thing most likely to actually be broken instead — that zig
          # itself is reachable — plus that the binary landed on PATH.
          python3 -m ziglang version
          command -v cargo-zigbuild

      # --locked so the build fails loudly rather than silently resolving a different dependency
      # graph than the one Cargo.lock records; the output of this step is packed by publish.yaml.
      - name: Build native library
        run: |
          set -euo pipefail
          if [ -n "${{ matrix.zig_target }}" ]; then
            cargo zigbuild --release --locked --target "${{ matrix.zig_target }}"
          else
            cargo build --release --locked --target "${{ matrix.target }}"
          fi

      # Cheap guard against a silently mis-targeted build. A wrong-architecture library would not
      # fail the tests loudly either: FunctionHelper.TryExecute swallows the load failure and the
      # API just returns false.
      - name: Verify the built library's architecture
        run: |
          set -euo pipefail
          built="target/${{ matrix.target }}/release/${{ matrix.cargo_out }}"
          test -f "$built" || { echo "::error::cargo did not produce $built"; exit 1; }

          if command -v file >/dev/null 2>&1; then
            described=$(file -b "$built")
          else
            # Windows runners have no file(1); read the PE machine field instead.
            described=$(powershell -NoProfile -Command "
              \$fs = [IO.File]::OpenRead('$built')
              \$br = New-Object IO.BinaryReader(\$fs)
              \$fs.Position = 0x3C
              \$fs.Position = \$br.ReadUInt32() + 4
              switch (\$br.ReadUInt16()) {
                0x8664  { 'x86-64' }
                0xAA64  { 'aarch64' }
                default { 'unknown' }
              }")
          fi

          # Case-insensitive: file(1) reports "aarch64" on Linux but "Aarch64" for a Windows PE.
          echo "$built -> $described"
          if printf '%s' "$described" | grep -Eiq '${{ matrix.expect_arch }}'; then
            echo "Architecture matches ${{ matrix.rid }}."
          else
            echo "::error::Expected /${{ matrix.expect_arch }}/i for ${{ matrix.rid }}, got: $described"
            exit 1
          fi

      # The whole point of building Linux through zigbuild is the glibc floor, so assert it rather
      # than trust it. A silently raised floor would only surface as install failures downstream.
      - name: Verify the glibc floor
        if: matrix.zig_target != ''
        run: |
          set -euo pipefail
          built="target/${{ matrix.target }}/release/${{ matrix.cargo_out }}"
          floor="${{ matrix.zig_target }}"
          floor="${floor##*-gnu.}"

          highest=$(objdump -T "$built" \
            | grep -oE 'GLIBC_[0-9]+\.[0-9]+(\.[0-9]+)?' \
            | sed 's/GLIBC_//' \
            | sort -V \
            | tail -1)
          echo "Highest glibc symbol required: ${highest:-none}  (floor: $floor)"

          if [ -n "$highest" ] && [ "$(printf '%s\n%s\n' "$highest" "$floor" | sort -V | tail -1)" != "$floor" ]; then
            echo "::error::Library needs glibc $highest, above the intended $floor floor"
            exit 1
          fi

      # Place the library where the csproj expects it (the binaries are not in git). The csproj copies the file matching this host's RID into the test
      # output directory, which is exactly this one.
      - name: Stage the built library
        run: |
          set -euo pipefail
          cp "target/${{ matrix.target }}/release/${{ matrix.cargo_out }}" \
             ".Net/OPAQUE.Net/${{ matrix.staged }}"
          ls -l ".Net/OPAQUE.Net/${{ matrix.staged }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Both projects are AnyCPU, so a solution build and a bare project build resolve the same
      # output directory per target framework (bin/<config>/net8.0, net10.0 for the tests) and --no-build is safe either way. Going through the
      # solution just exercises both projects in one command.
      #
      # Do not reintroduce a <Platforms>/Platform pin here or in the csproj files: it stamps the
      # test assembly with that architecture, and VSTest then demands a matching dotnet host, which
      # does not exist on the arm64 runners.
      - name: Build
        run: dotnet build .Net/OPAQUE.Net/OPAQUE.Net.sln --configuration Release

      - name: Check local pack is refused
        if: matrix.rid == 'linux-x64'
        run: scripts/check-pack-guard.sh

      - name: Test
        run: dotnet test .Net/OPAQUE.Net/OPAQUE.Net.sln --configuration Release --no-build

      - name: Upload native library
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-${{ matrix.rid }}
          path: .Net/OPAQUE.Net/${{ matrix.staged }}
          if-no-files-found: error
          retention-days: 7
