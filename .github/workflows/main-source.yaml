# main only accepts pull requests coming from develop. Make this check required in the main ruleset.
name: main source

on:
  pull_request:
    branches:
      - main

permissions: {}

jobs:
  from_develop:
    runs-on: ubuntu-24.04
    steps:
      # A fork can name its branch develop too: require this repository's own develop.
      - env:
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          [ "$HEAD" = "develop" ] && [ "$HEAD_REPO" = "$REPO" ] || { echo "::error::PRs into main must come from $REPO:develop, got '$HEAD_REPO:$HEAD'"; exit 1; }
